  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#134e4a" stroke-opacity="0.35" stroke-width="8"/>

  <!-- Star -->
  <path d="M 256 86 L 268.4 143.1 L 327.3 143.1 L 279.4 178.9 L 295.5 235.3 L 256 205.6 L 216.5 235.3 L 232.6 178.9 L 184.7 143.1 L 243.6 143.1 Z"
