  <ellipse cx="256" cy="262" rx="150" ry="12" fill="#0f766e" opacity="0.35"/>

  <!-- Open book -->
  <path d="M 136 300 L 248 282 L 248 402 L 136 420 Z" fill="url(#pageL)" stroke="#14b8a6" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 376 300 L 264 282 L 264 402 L 376 420 Z" fill="url(#pageR)" stroke="#14b8a6" stroke-width="6" stroke-linejoin="round"/>
